# Sestavení a testy pro všechny podporované platformy.
# ARM64 runnery jsou zdarma jen pro veřejné repozitáře.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.4"

jobs:
  lint:
    name: Formát a clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Komentáře v kódu česky i anglicky (CONTRIBUTING.md → Komentáře v kódu).
      - run: python3 scripts/komentare.py kontrola
      # Přehled změn CHANGELOG.md / CHANGELOG.en.md (CONTRIBUTING.md → Vydání nové verze).
      - run: python3 scripts/zmeny.py kontrola
      # Dokumentace formátů souborů – schémata, vzorové soubory, historie verzí
      # (CONTRIBUTING.md → Formáty souborů).
      - run: python3 -m pip install --user --break-system-packages "jsonschema>=4.18"
      - run: python3 scripts/formaty.py kontrola
      # Archiv verzí a průběžné sestavení (CONTRIBUTING.md → Vydání nové verze).
      - run: python3 scripts/archiv.py test
      # Přenositelnost na web (CONTRIBUTING.md → Přenositelnost): aplikace používá
      # web_time místo std::time (std::time::Instant::now() ve WebAssembly spadne).
      - name: Přenositelnost – čas přes web_time
        run: |
          if grep -rnE "std::time::(\{[^}]*)?(Instant|SystemTime)" crates/logicflow/src \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo "::error::Místo std::time::Instant/SystemTime použijte web_time (viz CONTRIBUTING.md → Přenositelnost)."
            exit 1
          fi

  wasm:
    # Jádro se musí dát přeložit pro WebAssembly – základ budoucí webové verze
    # (iPad, iPhone, Android, Chromebook). Clippy v jádru navíc zakazuje práci se soubory,
    # vlákna a systémový čas (crates/logicflow-core/clippy.toml).
    name: Jádro pro WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo build -p logicflow-core --target wasm32-unknown-unknown

  napoveda:
    # Nápověda v Markdownu (docs/napoveda): sestavení obou jazyků mdBookem.
    # Shodu kapitol a obrázků hlídá test crates/logicflow/tests/napoveda.rs.
    name: Nápověda
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - run: mdbook build docs/napoveda/cs
      - run: mdbook build docs/napoveda/en
      - uses: actions/upload-artifact@v7
        with:
          name: napoveda-html
          path: target/napoveda
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: logicflow.exe
          - name: windows-arm64
            os: windows-11-arm
            exe: logicflow.exe
          - name: macos-arm64
            os: macos-latest
            exe: logicflow
          - name: macos-x64
            os: macos-15-intel
            exe: logicflow
          - name: linux-x64
            os: ubuntu-24.04
            exe: logicflow
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: logicflow-${{ matrix.name }}
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error

  raspberry-pi:
    # Sestavuje se v Debianu 13 (Trixie), na kterém stojí Raspberry Pi OS,
    # aby výsledný program fungoval se stejnými verzemi systémových knihoven.
    name: linux-arm64 (Raspberry Pi OS)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Nástroje a knihovny
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64-trixie
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: logicflow-linux-arm64-raspberry-pi
          path: target/release/logicflow
          if-no-files-found: error
