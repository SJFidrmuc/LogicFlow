# Vydání verze: po zveřejnění vydání (Release) na GitHubu se sestaví program
# pro všechny platformy a balíčky se automaticky připojí k vydání.
#
# Postup: Releases → Draft a new release → tag ve tvaru vX.Y.Z (např. v0.3.1)
# → Publish release. Pro dodatečné sestavení existujícího vydání:
# Actions → Vydání → Run workflow.
#
# Při vydání se sestaví i nápověda (docs/napoveda, mdBook): k vydání se připojí
# ZIP s HTML nápovědou a – je-li v repozitáři proměnná NAPOVEDA_PAGES = true –
# nápověda se zveřejní na GitHub Pages (česky v kořeni, anglicky v /en/).
#
# Před sestavením se ověří, že tag odpovídá verzi v Cargo.toml a že je verze
# popsaná v CHANGELOG.md a CHANGELOG.en.md. Má-li vydání prázdný popis, doplní se
# poznámkami z přehledu změn (česky a anglicky).
#
# Spolu s nápovědou se na GitHub Pages zveřejní i archiv verzí (/vydani/,
# scripts/archiv.py): tabulka vydání × platforma s odkazy ke stažení.
# Průběžné sestavení z main (tag „prubezne“, workflow prubezne.yml) se tu přeskočí.
#
# [en] Together with the help, the version archive is published on GitHub Pages
# (/vydani/, scripts/archiv.py): a table of releases × platforms with download links.
# The rolling build from main (tag "prubezne", workflow prubezne.yml) is skipped here.
name: Vydání

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existujícího vydání (např. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MDBOOK_VERSION: "0.5.4"

jobs:
  kontrola:
    # Tag = verze programu a verze popsaná v přehledu změn (scripts/zmeny.py).
    # Chrání před vydáním ze staré revize (stalo se u první verze v0.3.1).
    name: Kontrola verze a přehledu změn
    # Jen tagy verzí vX.Y.Z – ne průběžné sestavení (ostatní úlohy se tím přeskočí).
    # [en] Only version tags vX.Y.Z – not the rolling build (the other jobs are skipped too).
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Verze a přehled změn
        run: |
          if [ -f scripts/zmeny.py ]; then
            python3 scripts/zmeny.py kontrola --tag "$TAG"
          else
            echo "::warning::Starší verze bez scripts/zmeny.py – kontrola přeskočena."
          fi

  build:
    name: ${{ matrix.name }}
    needs: kontrola
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Balíček (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "LogicFlow-$($env:TAG.TrimStart('v'))-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/logicflow.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "PACKAGE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Balíček (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name="LogicFlow-${TAG#v}-${{ matrix.name }}"
          mkdir "$name"
          cp target/release/logicflow README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  raspberry-pi:
    # Sestavení v Debianu 13 (Trixie), na kterém stojí Raspberry Pi OS.
    name: linux-arm64 (Raspberry Pi OS)
    needs: kontrola
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Nástroje
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: Balíček
        run: |
          name="LogicFlow-${TAG#v}-raspberry-pi-arm64"
          mkdir "$name"
          cp target/release/logicflow README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: raspberry-pi-arm64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  napoveda:
    name: Nápověda (HTML)
    needs: kontrola
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Sestavení (cs v kořeni, en v /en/)
        run: |
          mdbook build docs/napoveda/cs
          mdbook build docs/napoveda/en
          rm -rf site
          cp -r target/napoveda/cs site
          cp -r target/napoveda/en site/en
      - name: Balíček
        run: |
          name="LogicFlow-${TAG#v}-napoveda-html"
          cp -r site "$name"
          zip -qr "$name.zip" "$name"
          echo "PACKAGE=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: napoveda
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  pages:
    # Zapnutí: Settings → Pages → Source: GitHub Actions (a případně vlastní
    # doména napoveda.logicflow-sim.cz), v Settings → Environments → github-pages
    # povolit nasazení z tagů v* (výchozí pravidlo pouští jen větev main)
    # a nakonec Settings → Secrets and variables → Actions → Variables →
    # NAPOVEDA_PAGES = true.
    # Až po připojení balíčků k vydání, aby archiv verzí obsahoval i tuto verzi.
    # [en] Only after the packages are attached, so the archive includes this version.
    name: Nápověda a archiv verzí na webu (GitHub Pages)
    needs: publish
    if: vars.NAPOVEDA_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Skript archivu z výchozí větve, ne z tagu: i při dodatečném sestavení
      # starší verze (bez scripts/archiv.py) se archiv vytvoří. Nápověda je z tagu.
      # [en] The archive script from the default branch, not from the tag: the archive
      # is created even when rebuilding an older version (without scripts/archiv.py).
      # The help comes from the tag.
      - uses: actions/checkout@v7
        with:
          path: zdroj
      - uses: actions/download-artifact@v8
        with:
          name: napoveda
      - name: Nápověda a archiv verzí (/vydani/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -q "LogicFlow-${TAG#v}-napoveda-html.zip"
          mv "LogicFlow-${TAG#v}-napoveda-html" site
          gh api "repos/${{ github.repository }}/releases" --paginate --slurp > vydani.json
          python3 zdroj/scripts/archiv.py html vydani.json site/vydani
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    name: Připojit k vydání
    needs: [build, raspberry-pi, napoveda]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: zdroj
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Poznámky k vydání z přehledu změn
        # Jen když je popis vydání prázdný – ručně napsaný popis se nepřepisuje.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f zdroj/scripts/zmeny.py ]; then exit 0; fi
          popis=$(gh release view "$TAG" --json body --jq .body --repo "${{ github.repository }}")
          if [ -z "$(echo "$popis" | tr -d '[:space:]')" ]; then
            python3 zdroj/scripts/zmeny.py poznamky "$TAG" > poznamky.md
            gh release edit "$TAG" --notes-file poznamky.md --repo "${{ github.repository }}"
          else
            echo "Popis vydání už je vyplněný – ponechán."
          fi
      - name: Nahrát soubory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
