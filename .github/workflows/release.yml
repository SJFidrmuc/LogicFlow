# Vydání verze: po zveřejnění vydání (Release) na GitHubu se sestaví program
# pro všechny platformy a balíčky se automaticky připojí k vydání.
#
# Postup: Releases → Draft a new release → tag ve tvaru vX.Y.Z (např. v0.3.1)
# → Publish release. Pro dodatečné sestavení existujícího vydání:
# Actions → Vydání → Run workflow.
#
# Při vydání se sestaví i nápověda (docs/napoveda, mdBook): k vydání se připojí
# ZIP s HTML nápovědou a – je-li v repozitáři proměnná NAPOVEDA_PAGES = true –
# nápověda se zveřejní na GitHub Pages (česky v kořeni, anglicky v /en/).
name: Vydání

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existujícího vydání (např. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Balíček (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "LogicFlow-$($env:TAG.TrimStart('v'))-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/logicflow.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "PACKAGE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Balíček (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name="LogicFlow-${TAG#v}-${{ matrix.name }}"
          mkdir "$name"
          cp target/release/logicflow README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  raspberry-pi:
    # Sestavení v Debianu 13 (Trixie), na kterém stojí Raspberry Pi OS.
    name: linux-arm64 (Raspberry Pi OS)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Nástroje
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: Balíček
        run: |
          name="LogicFlow-${TAG#v}-raspberry-pi-arm64"
          mkdir "$name"
          cp target/release/logicflow README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "PACKAGE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: raspberry-pi-arm64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  napoveda:
    name: Nápověda (HTML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Sestavení (cs v kořeni, en v /en/)
        run: |
          mdbook build docs/napoveda/cs
          mdbook build docs/napoveda/en
          rm -rf site
          cp -r target/napoveda/cs site
          cp -r target/napoveda/en site/en
      - name: Balíček
        run: |
          name="LogicFlow-${TAG#v}-napoveda-html"
          cp -r site "$name"
          zip -qr "$name.zip" "$name"
          echo "PACKAGE=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: napoveda
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: vars.NAPOVEDA_PAGES == 'true'
        with:
          path: site

  pages:
    # Zapnutí: Settings → Pages → Source: GitHub Actions (a případně vlastní
    # doména napoveda.logicflow-sim.cz), v Settings → Environments → github-pages
    # povolit nasazení z tagů v* (výchozí pravidlo pouští jen větev main)
    # a nakonec Settings → Secrets and variables → Actions → Variables →
    # NAPOVEDA_PAGES = true.
    name: Nápověda na webu (GitHub Pages)
    needs: napoveda
    if: vars.NAPOVEDA_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    name: Připojit k vydání
    needs: [build, raspberry-pi, napoveda]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Nahrát soubory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
