[book]
title = "LogicFlow – nápověda"
authors = ["Stanislav Jan Fidrmuc"]
language = "cs"
src = "src"

[build]
build-dir = "../../../target/napoveda/cs"

[output.html]
git-repository-url = "https://github.com/SJFidrmuc/LogicFlow"
edit-url-template = "https://github.com/SJFidrmuc/LogicFlow/edit/main/docs/napoveda/cs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["logicflow.css"]

[output.html.search]
enable = true

[output.html.print]
enable = true
